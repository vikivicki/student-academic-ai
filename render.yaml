services:
  - type: web
    name: student-academics-agent-api
    runtime: python
    rootDir: ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    disk:
      name: student-agent-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: STORAGE_DIR
        value: /var/data